apiVersion: apps/v1
kind: Deployment
metadata:
  name: billo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billo-ui
  template:
    metadata:
      labels:
        app: billo-ui
    spec:
      imagePullSecrets:
        - name: billo-dockerhub
      containers:
        - name: billo-ui
          image: bramdewit/billo-ui
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: billo-ui
spec:
  type: ClusterIP
  selector:
    app: billo-ui
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billo-ui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - HOST_PLACEHOLDER
      secretName: billo-ui-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: billo-ui
                port:
                  number: 80
