apiVersion: v1
kind: ConfigMap
metadata:
  name: billo-backend-config
data:
  BILLO_DB_PORT: "3306"
  BILLO_REDIS_HOST: "billo-redis"
  BILLO_REDIS_PORT: "6379"
  BILLO_MAIL_PORT: "465"
  BILLO_MAIL_USE_SSL: "True"
  BILLO_PASSWORD_RESET_TOKEN_EXPIRE_HOURS: "1"
  BILLO_MINIO_PORT: "9000"
  BILLO_MINIO_SECURE: "False"
  PROMETHEUS_MULTIPROC_DIR: "/tmp"
