apiVersion: apps/v1
kind: Deployment
metadata:
  name: billo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billo-api
  template:
    metadata:
      labels:
        app: billo-api
    spec:
      imagePullSecrets:
        - name: billo-dockerhub
      containers:
        - name: billo-api
          image: bramdewit/billo-api
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: billo-backend-config
            - secretRef:
                name: billo-backend-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: billo-api
spec:
  type: ClusterIP
  selector:
    app: billo-api
  ports:
    - port: 5000
      targetPort: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billo-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - HOST_PLACEHOLDER
      secretName: billo-api-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: billo-api
                port:
                  number: 5000
