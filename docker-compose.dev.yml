services:
  db:
    image: mariadb:latest
    container_name: billo-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: billo_root_password
      MYSQL_DATABASE: billo_db
      MYSQL_USER: billo_user
      MYSQL_PASSWORD: billo_password

  redis:
    image: redis:latest
    container_name: billo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  mail:
    image: maildev/maildev
    container_name: billo-maildev
    command:
      - "--incoming-user=billo@mail.com"
      - "--incoming-pass=12345678"
    ports:
      - "1080:1080"
      - "1025:1025"

  minio:
    image: minio/minio:latest
    container_name: billo-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  minio_data:
