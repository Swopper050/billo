services:
  ui:
    image: <dockerhub_namespace>/billo-ui:stable
    container_name: billo-ui
    volumes:
      - '/var/www/certbot:/var/www/certbot'
      - '/etc/letsencrypt/:/etc/letsencrypt/'
      - '/home/${BILLO_SERVER_USER}/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro'
    ports:
      - '80:80'
      - '443:443'
    networks:
      - billo-network
    depends_on:
      - api
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '10'

  api:
    image: <dockerhub_namespace>/billo-api:stable
    container_name: billo-api
    environment:
      BILLO_FRONTEND_URL: https://app.billo.com
      BILLO_API_URL: https://api.billo.com
      BILLO_SECRET_KEY: $BILLO_SECRET_KEY
      BILLO_FERNET_SECRET_KEY: $BILLO_FERNET_SECRET_KEY
      BILLO_DB_NAME: $BILLO_DB_NAME
      BILLO_DB_USER: $BILLO_DB_USER
      BILLO_DB_PASSWORD: $BILLO_DB_PASSWORD
      BILLO_DB_HOST: 'db'
      BILLO_DB_PORT: '3306'
      BILLO_REDIS_HOST: 'redis'
      BILLO_MAIL_SERVER: $BILLO_MAIL_SERVER
      BILLO_MAIL_PORT: $BILLO_MAIL_PORT
      BILLO_MAIL_USE_SSL: 'True'
      BILLO_MAIL_USERNAME: $BILLO_MAIL_USERNAME
      BILLO_MAIL_PASSWORD: $BILLO_MAIL_PASSWORD
      BILLO_MAIL_DEFAULT_SENDER: $BILLO_MAIL_DEFAULT_SENDER
      BILLO_PASSWORD_RESET_TOKEN_EXPIRE_HOURS: 1
      BILLO_MOLLIE_API_KEY: $BILLO_MOLLIE_API_KEY
      BILLO_MINIO_HOST: $BILLO_MINIO_HOST
      BILLO_MINIO_PORT: $BILLO_MINIO_PORT
      BILLO_MINIO_USER: $BILLO_MINIO_USER
      BILLO_MINIO_PASSWORD: $BILLO_MINIO_PASSWORD
      BILLO_MINIO_BUCKET: $BILLO_MINIO_BUCKET
      BILLO_MINIO_SECURE: 'True'
    networks:
      - billo-network
    depends_on:
      - db
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '5'

  tasks:
    image: <dockerhub_namespace>/billo-tasks:stable
    container_name: billo-tasks
    environment:
      BILLO_FRONTEND_URL: https://app.billo.com
      BILLO_API_URL: https://api.billo.com
      BILLO_SECRET_KEY: $BILLO_SECRET_KEY
      BILLO_FERNET_SECRET_KEY: $BILLO_FERNET_SECRET_KEY
      BILLO_DB_NAME: $BILLO_DB_NAME
      BILLO_DB_USER: $BILLO_DB_USER
      BILLO_DB_PASSWORD: $BILLO_DB_PASSWORD
      BILLO_DB_HOST: 'db'
      BILLO_DB_PORT: '3306'
      BILLO_REDIS_HOST: 'redis'
      BILLO_MAIL_SERVER: $BILLO_MAIL_SERVER
      BILLO_MAIL_PORT: $BILLO_MAIL_PORT
      BILLO_MAIL_USE_SSL: 'True'
      BILLO_MAIL_USERNAME: $BILLO_MAIL_USERNAME
      BILLO_MAIL_PASSWORD: $BILLO_MAIL_PASSWORD
      BILLO_MAIL_DEFAULT_SENDER: $BILLO_MAIL_DEFAULT_SENDER
      BILLO_MOLLIE_API_KEY: $BILLO_MOLLIE_API_KEY
    networks:
      - billo-network
    depends_on:
      - redis
      - db
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '5'

  db:
    image: mariadb:latest
    container_name: billo-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE: $BILLO_DB_NAME
      MYSQL_USER: $BILLO_DB_USER
      MYSQL_PASSWORD: $BILLO_DB_PASSWORD
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - billo-network
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '5'

  redis:
    image: redis:latest
    container_name: billo-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    networks:
      - billo-network
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '5'

  certbot:
    image: certbot/certbot:latest
    container_name: billo-certbot
    volumes:
      - '/var/www/certbot:/var/www/certbot'
      - '/var/lib/letsencrypt/:/var/lib/letsencrypt/'
      - '/etc/letsencrypt/:/etc/letsencrypt/'
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot -v; sleep 12h & wait $${!}; done;'"
    networks:
      - billo-network
    logging:
      driver: 'json-file'
      options:
        max-size: '1m'
        max-file: '3'


networks:
  billo-network:
    driver: bridge


volumes:
  db_data_prod:
  redis_data_prod:
